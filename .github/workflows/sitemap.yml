name: Regenerate sitemap

# Regenere sitemap.xml automatiquement des qu'une page FR ou EN est ajoutee ou modifiee.
# Le push du sitemap par GITHUB_TOKEN ne re-declenche pas ce workflow (protection GitHub).
on:
  push:
    branches: [main]
    paths:
      - 'fr/**.html'
      - 'en/**.html'
      - 'generate_sitemap.py'

permissions:
  contents: write

jobs:
  sitemap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # historique complet pour dater les pages via git log
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Regenerate sitemap
        run: python generate_sitemap.py
      - name: Commit sitemap if changed
        run: |
          if ! git diff --quiet sitemap.xml; then
            git config user.name "galogix-sitemap-bot"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add sitemap.xml
            git commit -m "chore: regenere sitemap.xml automatiquement [skip ci]"
            git push
          else
            echo "sitemap.xml inchange, rien a committer"
          fi
